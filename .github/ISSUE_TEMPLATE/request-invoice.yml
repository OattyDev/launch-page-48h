name: Request invoice
description: Order a Launch Page in 48 Hours — you'll get a fixed-scope agreement + Wise invoice
title: "[Invoice request] "
labels: ["invoice-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## How this works
        1. Submit this form with your product URL and preferences.
        2. You'll get a **fixed-scope agreement** and a **Wise invoice** as a reply on this issue.
        3. **Work starts when payment clears** (bank transfer / Wise).
        4. The **48-hour clock starts from cleared payment** — not from opening this issue.

        Questions? Leave a note below. No Stripe account needed.

  - type: input
    id: product-url
    attributes:
      label: Product URL
      description: Link to your product, app, or current site (required brief).
      placeholder: https://yoursite.com
    validations:
      required: true

  - type: input
    id: name-handle
    attributes:
      label: Name / handle
      description: How should we address you? (name, X/Twitter, GitHub, email — whatever you prefer)
      placeholder: Alex / @alex
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Standard ships within 48h of cleared payment. Rush is same-day when payment clears before noon local time (limited capacity).
      options:
        - Standard — $149 (48h from cleared payment)
        - Rush — $249 (same-day)
      default: 0
    validations:
      required: true

  - type: textarea
    id: must-have
    attributes:
      label: Must-have notes
      description: Who it's for, price/CTA you want, or anything that must appear on the page. Short is fine.
      placeholder: "Audience: solo founders. CTA: book a demo. Price: $29/mo."
    validations:
      required: false

  - type: input
    id: wise-payer
    attributes:
      label: Preferred Wise payer name
      description: Name that will appear on the Wise / bank transfer (helps match payment). Optional if unknown yet.
      placeholder: Acme LLC / Jane Doe
    validations:
      required: false
