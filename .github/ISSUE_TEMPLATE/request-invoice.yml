name: Request invoice
description: Order a fixed-scope SKU — you'll get a agreement + Wise invoice on this issue
title: "[Invoice request] "
labels: ["invoice-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## How this works
        1. Submit this form with your product URL and SKU.
        2. You'll get a **fixed-scope agreement** and a **Wise invoice** as a reply on this issue.
        3. **Work starts when payment clears** (bank transfer / Wise).
        4. Turnaround clocks start from **cleared payment** — not from opening this issue.

        SKUs: First client Launch Page $99 (one-time) · Launch Page $299 / Rush $499 · Grafana Alert Noise Kill $799 · Founder Site Sprint $1,499.
        Sales page: https://oattydev.github.io/launch-page-48h/

  - type: dropdown
    id: sku
    attributes:
      label: SKU
      description: Pick the package you want invoiced.
      options:
        - First client Launch Page — $99 (48h · one-time special)
        - Launch Page — $299 (48h from cleared payment)
        - Launch Page Rush — $499 (same-day)
        - Grafana Alert Noise Kill — $799 (72h)
        - Founder Site Sprint — $1,499 (5 days)
      default: 0
    validations:
      required: true

  - type: input
    id: product-url
    attributes:
      label: Product / Grafana URL
      description: Link to your product, app, current site, or Grafana context (required brief).
      placeholder: https://yoursite.com
    validations:
      required: true

  - type: input
    id: name-handle
    attributes:
      label: Name / handle
      description: How should we address you? (name, X/Twitter, GitHub, email — whatever you prefer)
      placeholder: Alex / @alex
    validations:
      required: false

  - type: textarea
    id: must-have
    attributes:
      label: Must-have notes
      description: Who it's for, price/CTA, alert pain points, secondary page preference (pricing vs about), or anything that must appear. Short is fine.
      placeholder: "Audience: solo founders. CTA: book a demo. Price: $29/mo."
    validations:
      required: false

  - type: input
    id: wise-payer
    attributes:
      label: Preferred Wise payer name
      description: Name that will appear on the Wise / bank transfer (helps match payment). Optional if unknown yet.
      placeholder: Acme LLC / Jane Doe
    validations:
      required: false
